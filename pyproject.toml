[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regcomments"
version = "0.1.0"
description = "Bulk-download public comments (text and attached comment letters) from Regulations.gov"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
regcomments = "regcomments.cli:main"

[tool.setuptools]
packages = ["regcomments"]
